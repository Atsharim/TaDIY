name: Test

on:
  push:
    branches:
      - main
      - dev
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml ruff codespell isort bandit[toml]

      - name: Run Ruff Lint and Format check
        run: |
          ruff check custom_components/tadiy/
          ruff format --check custom_components/tadiy/

      - name: Run codespell
        run: |
          codespell custom_components/tadiy/ --skip="*.pyc,*.svg" || true

      - name: Run isort check
        run: |
          isort --check-only --diff custom_components/tadiy/ || true

      - name: Run Bandit security scan
        run: |
          bandit -r custom_components/tadiy/ -q || true

      - name: Run unit tests
        run: |
          python -m unittest discover -s tests -v

      - name: Validate JSON files
        run: |
          python -m json.tool hacs.json > /dev/null
          python -m json.tool custom_components/tadiy/manifest.json > /dev/null
          python -m json.tool custom_components/tadiy/strings.json > /dev/null
          python -m json.tool custom_components/tadiy/translations/de.json > /dev/null
          python -m json.tool custom_components/tadiy/translations/en.json > /dev/null

      - name: Validate JavaScript and run schedule regression tests
        run: |
          node -c custom_components/tadiy/www/tadiy-panel.js
          node -c custom_components/tadiy/www/tadiy-schedule-card.js
          node tests/test_schedule_card.js

