force_refresh:
  name: Force Refresh
  description: Force an immediate refresh of all TaDIY data
  fields: {}

reset_learning:
  name: Reset Learning Data
  description: Reset heating rate learning data for a room or all rooms
  fields:
    room:
      name: Room Name
      description: Name of the room to reset (leave empty for all rooms)
      required: false
      example: "TA_Wohnbereich"
      selector:
        text:

boost_all_rooms:
  name: Boost All Rooms
  description: Boost heating in all rooms to maximum temperature for specified duration
  fields:
    temperature:
      name: Boost Temperature
      description: Target temperature during boost (°C)
      required: false
      default: 30
      selector:
        number:
          min: 20
          max: 35
          step: 0.5
          unit_of_measurement: "°C"
          mode: slider
    duration_minutes:
      name: Duration
      description: Duration of boost in minutes
      required: false
      default: 60
      selector:
        number:
          min: 15
          max: 180
          step: 5
          unit_of_measurement: "min"
          mode: slider

set_hub_mode:
  name: Set Hub Mode
  description: Change the TaDIY hub operating mode
  fields:
    mode:
      name: Mode
      description: Target operating mode
      required: true
      selector:
        select:
          options:
            - label: "Normal"
              value: "normal"
            - label: "Home Office"
              value: "homeoffice"
            - label: "Vacation"
              value: "vacation"
            - label: "Party"
              value: "party"

set_homeoffice_tomorrow:
  name: Set Homeoffice Tomorrow
  description: Schedules or cancels single-day homeoffice mode for tomorrow.
  fields:
    enabled:
      name: Enabled
      description: Whether homeoffice mode should activate tomorrow
      required: false
      default: true
      selector:
        boolean:

set_heating_curve:
  name: Set Heating Curve
  description: Manually sets the heating rate for a room (overrides learned value)
  fields:
    room:
      name: Room Name
      description: Name of the room to configure
      required: true
      example: "Living Room"
      selector:
        text:
    heating_rate:
      name: Heating Rate
      description: Heating rate in degrees Celsius per hour
      required: true
      selector:
        number:
          min: 0.05
          max: 10.0
          step: 0.1
          unit_of_measurement: "°C/h"
          mode: slider

set_hub_config:
  name: Set Hub Configuration
  description: Updates global hub settings like frost protection, boost parameters, and window timeouts.
  fields:
    frost_protection_temp:
      name: Frost Protection Temperature
      description: Target temperature to prevent freezing
      required: false
      selector:
        number:
          min: 3.0
          max: 15.0
          step: 0.5
          unit_of_measurement: "°C"
    boost_temperature:
      name: Boost Temperature
      description: Target temperature during boost mode
      required: false
      selector:
        number:
          min: 18.0
          max: 30.0
          step: 0.5
          unit_of_measurement: "°C"
    boost_duration:
      name: Boost Duration
      description: Duration of boost mode in minutes
      required: false
      selector:
        number:
          min: 10
          max: 360
          step: 5
          unit_of_measurement: "min"
    window_open_timeout:
      name: Window Open Timeout
      description: Seconds after opening a window before heating pauses
      required: false
      selector:
        number:
          min: 5
          max: 600
          step: 5
          unit_of_measurement: "s"
    window_close_timeout:
      name: Window Close Cooldown
      description: Seconds after closing a window before heating resumes
      required: false
      selector:
        number:
          min: 5
          max: 600
          step: 5
          unit_of_measurement: "s"
    global_override_timeout:
      name: Global Override Timeout
      description: Default duration or trigger for manual overrides
      required: false
      selector:
        select:
          options:
            - label: "Nie (manuelle Änderungen bleiben für immer)"
              value: "never"
            - label: "1 Stunde"
              value: "1h"
            - label: "2 Stunden"
              value: "2h"
            - label: "3 Stunden"
              value: "3h"
            - label: "4 Stunden"
              value: "4h"
            - label: "Bis zum nächsten Zeitplan-Block"
              value: "next_block"
            - label: "Bis zum nächsten Tag (Mitternacht)"
              value: "next_day"
    early_start_offset:
      name: Early Start Offset
      description: Additional pre-heat time buffer in minutes
      required: false
      selector:
        number:
          min: 0
          max: 60
          step: 5
          unit_of_measurement: "min"
    early_start_max:
      name: Early Start Max
      description: Maximum allowed pre-heat time across all rooms in minutes
      required: false
      selector:
        number:
          min: 0
          max: 360
          step: 15
          unit_of_measurement: "min"
    friday_weekend_start_hour:
      name: Friday Weekend Start Hour
      description: Hour on Friday when weekend heating schedule begins
      required: false
      selector:
        number:
          min: 0
          max: 24
          step: 1
          unit_of_measurement: "h"
    homeoffice_end_hour:
      name: Homeoffice End Hour
      description: Hour when homeoffice profile transitions back to normal
      required: false
      selector:
        number:
          min: 0
          max: 24
          step: 1
          unit_of_measurement: "h"
    homeoffice_single_day:
      name: Homeoffice Single Day
      description: Auto-reset homeoffice mode (feierabend, midnight, or false)
      required: false
      selector:
        select:
          options:
            - label: "Reset zum Feierabend"
              value: "feierabend"
            - label: "Reset um Mitternacht"
              value: "midnight"
            - label: "Deaktiviert (dauerhaft)"
              value: "false"
    valve_protection_day:
      name: Valve Protection Day
      description: Day of the week for anti-calcification exercise (0=Monday, 6=Sunday)
      required: false
      selector:
        select:
          options:
            - label: "Montag"
              value: "0"
            - label: "Dienstag"
              value: "1"
            - label: "Mittwoch"
              value: "2"
            - label: "Donnerstag"
              value: "3"
            - label: "Freitag"
              value: "4"
            - label: "Samstag"
              value: "5"
            - label: "Sonntag"
              value: "6"
    valve_protection_hour:
      name: Valve Protection Hour
      description: Hour of day for valve protection exercise (0-23)
      required: false
      selector:
        number:
          min: 0
          max: 23
          step: 1
          unit_of_measurement: "h"
    valve_protection_interval_weeks:
      name: Valve Protection Interval Weeks
      description: Interval in weeks between valve protection cycles
      required: false
      selector:
        number:
          min: 1
          max: 4
          step: 1
          unit_of_measurement: "w"
    use_heating_curve:
      name: Use Heating Curve
      description: Enable outdoor weather compensation curve
      required: false
      selector:
        boolean:
    heating_curve_slope:
      name: Heating Curve Slope
      description: Heating curve slope factor
      required: false
      selector:
        number:
          min: 0.2
          max: 3.5
          step: 0.1
    use_weather_prediction:
      name: Use Weather Prediction
      description: Enable solar and temperature forecast adjustments
      required: false
      selector:
        boolean:
    dont_heat_below_outdoor:
      name: Summer Switch-off Outdoor Temperature
      description: Do not heat when outdoor temperature is above this value
      required: false
      selector:
        number:
          min: 10.0
          max: 25.0
          step: 0.5
          unit_of_measurement: "°C"
    boiler_temp_sensor:
      name: Boiler Flow Sensor
      description: Entity ID of boiler flow temperature sensor
      required: false
      selector:
        entity:
          domain: sensor
    dhw_temp_sensor:
      name: DHW Circulation Sensor
      description: Entity ID of DHW circulation temperature sensor
      required: false
      selector:
        entity:
          domain: sensor
    boiler_min_run_time:
      name: Boiler Minimum Run Time
      description: Minimum run time for boiler in seconds
      required: false
      selector:
        number:
          min: 60
          max: 1800
          step: 30
          unit_of_measurement: "s"
    cycle_lock_on_setpoint_drop:
      name: Cycle Lock on Setpoint Drop
      description: Immediately release cycle lock when room target is lowered
      required: false
      selector:
        boolean:
    window_neighbor_setback_enabled:
      name: Neighbor Window Setback Enabled
      description: Enable temperature setback when neighboring window opens
      required: false
      selector:
        boolean:
    window_neighbor_setback_delta:
      name: Neighbor Window Setback Delta
      description: Temperature setback when adjacent room window opens (°C)
      required: false
      selector:
        number:
          min: 0.5
          max: 5.0
          step: 0.5
          unit_of_measurement: "°C"
    window_house_setback_delta:
      name: House Fallback Window Setback Delta
      description: Temperature setback when any other window opens (°C)
      required: false
      selector:
        number:
          min: 0.5
          max: 5.0
          step: 0.5
          unit_of_measurement: "°C"
    global_offset_step:
      name: Global Offset Step
      description: Step size for quick offset buttons (°C)
      required: false
      selector:
        number:
          min: 0.5
          max: 5.0
          step: 0.5
          unit_of_measurement: "°C"
    global_offset_mode:
      name: Global Offset Mode
      description: Duration mode for quick offset
      required: false
      selector:
        select:
          options:
            - label: "Bis zum nächsten Zeitplan-Block"
              value: "next_block"
            - label: "Feste Dauer (Stunden)"
              value: "duration"
    global_offset_duration_hours:
      name: Global Offset Duration
      description: Duration for quick offset when mode is duration (hours)
      required: false
      selector:
        number:
          min: 0.5
          max: 24.0
          step: 0.5
          unit_of_measurement: "h"
    person_entities:
      name: Person Entities
      description: List of person entities counted for presence
      required: false
      selector:
        entity:
          multiple: true
          domain: person

set_global_offset:
  name: Set Global Quick Offset
  description: Apply a temporary ±X°C offset across all rooms (e.g. for sunny days or quick boost)
  fields:
    offset:
      name: Temperature Offset
      description: Relative offset in °C (-5.0 to +5.0, set 0 to cancel)
      required: true
      default: 0.0
      selector:
        number:
          min: -5.0
          max: 5.0
          step: 0.5
          unit_of_measurement: "°C"
    mode:
      name: Offset Mode
      description: Duration mode ('next_block' or 'duration')
      required: false
      selector:
        select:
          options:
            - label: "Bis zum nächsten Zeitplan-Block"
              value: "next_block"
            - label: "Feste Dauer (Stunden)"
              value: "duration"
    duration_hours:
      name: Duration in Hours
      description: Duration when mode is set to 'duration'
      required: false
      selector:
        number:
          min: 0.5
          max: 24.0
          step: 0.5
          unit_of_measurement: "h"

set_room_config:
  name: Set Room Configuration
  description: Update room configuration settings dynamically
  fields:
    entity_id:
      name: Room Climate Entity
      description: Entity ID of the room climate entity or room ID
      required: true
      selector:
        entity:
          domain: climate
    away_temperature:
      name: Away Temperature
      description: Target temperature when away (°C)
      required: false
      selector:
        number:
          min: 5.0
          max: 22.0
          step: 0.5
          unit_of_measurement: "°C"
    tolerance:
      name: Temperature Tolerance
      description: Deadband / hysteresis tolerance (°C)
      required: false
      selector:
        number:
          min: 0.1
          max: 2.0
          step: 0.1
          unit_of_measurement: "°C"
    early_start_max_minutes:
      name: Max Early Start Minutes
      description: Maximum preheat time in minutes
      required: false
      selector:
        number:
          min: 0
          max: 360
          step: 15
          unit_of_measurement: "min"
    window_open_timeout:
      name: Window Open Timeout
      description: Wait time before shutting off heating when window opens (s)
      required: false
      selector:
        number:
          min: 5
          max: 300
          step: 5
          unit_of_measurement: "s"
    window_close_timeout:
      name: Window Close Cooldown
      description: Wait time before resuming heating after window closes (s)
      required: false
      selector:
        number:
          min: 5
          max: 300
          step: 5
          unit_of_measurement: "s"
    dont_heat_below_outdoor:
      name: Room Summer Switch-off Outdoor Temperature
      description: Do not heat when outdoor temperature is above this value (°C)
      required: false
      selector:
        number:
          min: 10.0
          max: 25.0
          step: 0.5
          unit_of_measurement: "°C"
    min_heating_rate:
      name: Minimum Heating Rate
      description: Minimum heating rate constraint (°C/h)
      required: false
      selector:
        number:
          min: 0.1
          max: 5.0
          step: 0.1
          unit_of_measurement: "°C/h"
    max_heating_rate:
      name: Maximum Heating Rate
      description: Maximum heating rate constraint (°C/h)
      required: false
      selector:
        number:
          min: 0.5
          max: 10.0
          step: 0.1
          unit_of_measurement: "°C/h"
    adjacent_rooms:
      name: Adjacent Rooms
      description: List of neighboring rooms for window setback and thermal coupling
      required: false
      selector:
        select:
          options: []
          multiple: true
          custom_value: true
    hysteresis:
      name: Hysteresis
      description: Temperature hysteresis / deadband (°C)
      required: false
      selector:
        number:
          min: 0.1
          max: 2.0
          step: 0.1
          unit_of_measurement: "°C"
    target_temp_step:
      name: Target Temperature Step
      description: Minimum step size for target temperatures (°C)
      required: false
      selector:
        number:
          min: 0.1
          max: 1.0
          step: 0.1
          unit_of_measurement: "°C"
    use_pid_control:
      name: Use PID Control
      description: Enable PID temperature regulation algorithm
      required: false
      selector:
        boolean:
    pid_kp:
      name: PID Proportional Gain (Kp)
      description: Proportional coefficient
      required: false
      selector:
        number:
          min: 0.1
          max: 5.0
          step: 0.1
    pid_ki:
      name: PID Integral Gain (Ki)
      description: Integral coefficient
      required: false
      selector:
        number:
          min: 0.001
          max: 0.1
          step: 0.001
    pid_kd:
      name: PID Derivative Gain (Kd)
      description: Derivative coefficient
      required: false
      selector:
        number:
          min: 0.0
          max: 1.0
          step: 0.01
    use_hvac_off_for_low_temp:
      name: Use HVAC Off For Low Temp
      description: Use HVAC off mode instead of minimum setpoint (for MOES TRVs)
      required: false
      selector:
        boolean:
    use_room_coupling:
      name: Use Room Coupling
      description: Adjust setpoint dynamically when adjacent rooms are heating
      required: false
      selector:
        boolean:
    coupling_strength:
      name: Coupling Strength
      description: Strength of adjacent room thermal coupling factor (0.1 - 1.0)
      required: false
      selector:
        number:
          min: 0.1
          max: 1.0
          step: 0.1
    trv_min_temp:
      name: TRV Min Temp
      description: Minimum target temperature accepted by TRV hardware
      required: false
      selector:
        number:
          min: 1.0
          max: 15.0
          step: 0.5
          unit_of_measurement: "°C"
    trv_max_temp:
      name: TRV Max Temp
      description: Maximum target temperature accepted by TRV hardware
      required: false
      selector:
        number:
          min: 20.0
          max: 40.0
          step: 0.5
          unit_of_measurement: "°C"
    disable_valve_protection:
      name: Disable Valve Protection
      description: Exclude this room from the periodic anti-calcification exercise
      required: false
      selector:
        boolean:
    override_timeout:
      name: Room Override Timeout
      description: Manual temperature override timeout duration or trigger
      required: false
      selector:
        select:
          options:
            - label: "Hub-Einstellung verwenden"
              value: "default"
            - label: "Nie (manuelle Änderungen bleiben für immer)"
              value: "never"
            - label: "1 Stunde"
              value: "1h"
            - label: "2 Stunden"
              value: "2h"
            - label: "3 Stunden"
              value: "3h"
            - label: "4 Stunden"
              value: "4h"
            - label: "Bis zum nächsten Zeitplan-Block"
              value: "next_block"
            - label: "Bis zum nächsten Tag (Mitternacht)"
              value: "next_day"
    trv_mode:
      name: TRV Mode
      description: TRV valve control strategy (standard, sonoff_pid, moes_hvac, default)
      required: false
      selector:
        select:
          options:
            - label: "Vom Hub erben"
              value: "default"
            - label: "Standard"
              value: "standard"
            - label: "Sonoff (PID Regelung)"
              value: "sonoff_pid"
            - label: "Moes (HVAC Aus)"
              value: "moes_hvac"
            - label: "Immer Zeitplan verwenden"
              value: "always"
